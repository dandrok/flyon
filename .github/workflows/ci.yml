name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            experimental: false
          # 3.15 is a release candidate today: it is here so the breakage shows up in a PR,
          # not the week it ships. A red 3.15 job does not block the merge.
          - python: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-fail-under=80 -m "not slow"
      - name: build and smoke-test the wheel
        if: matrix.python == '3.14'
        run: |
          uv build
          uv venv --python 3.14 /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          /tmp/wheelcheck/bin/flyon --version
