name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing: the token is minted per run, never stored
      contents: write # creating the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --python 3.14

      - name: never publish a red tree
        run: uv run pytest -m "not slow" && uv run ruff check . && uv run mypy

      - name: the tag must match the package version
        run: |
          version=$(uv run python -c "import pathlib,tomllib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          }

      - run: uv build

      - name: the wheel must install and run
        run: |
          uv venv --python 3.14 /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          /tmp/wheelcheck/bin/flyon --version

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
